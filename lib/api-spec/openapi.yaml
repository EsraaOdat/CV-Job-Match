openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Attributed public remote job listings
  - name: match
    description: AI analysis of a CV or skills list against live job listings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /jobs/search:
    get:
      operationId: searchJobs
      tags: [jobs]
      summary: Search public remote job listings
      description: Searches the public Himalayas remote-jobs API. CV contents are never sent to this endpoint.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - name: country
          in: query
          required: false
          description: ISO 3166-1 alpha-2 country code for candidate eligibility.
          schema:
            type: string
            minLength: 2
            maxLength: 2
            pattern: "^[A-Z]{2}$"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
      responses:
        "200":
          description: Matching public remote job listings with required attribution metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSearchResponse"
        "400":
          description: Invalid search filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The public job source is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /match:
    post:
      operationId: matchProfile
      tags: [match]
      summary: Analyze a CV or skills and return suggested roles and ranked jobs
      description: Sends the CV text or skills to Claude to extract a profile, searches Himalayas for the suggested roles, then scores each job against the profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
      responses:
        "200":
          description: Profile analysis with ranked jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "400":
          description: Missing or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The AI service or job source failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The server has no Anthropic API key configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    MatchRequest:
      type: object
      properties:
        cvText:
          type: string
          maxLength: 60000
        skills:
          type: string
          maxLength: 4000
        language:
          type: string
          enum: [ar, en]
        country:
          type: ["string", "null"]
          description: ISO 3166-1 alpha-2 code used to keep only jobs open to candidates in that country. Null searches worldwide.
          pattern: "^[A-Z]{2}$"
      required: [language]
    MatchResponse:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CandidateProfile"
        suggestedRoles:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedRole"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/MatchedJob"
        missingSkills:
          type: array
          items:
            $ref: "#/components/schemas/MissingSkill"
        meta:
          $ref: "#/components/schemas/MatchMeta"
      required: [profile, suggestedRoles, jobs, missingSkills, meta]
    CandidateProfile:
      type: object
      properties:
        summary:
          type: string
        skills:
          type: array
          items:
            type: string
        seniority:
          type: string
        yearsOfExperience:
          type: ["number", "null"]
      required: [summary, skills, seniority, yearsOfExperience]
    SuggestedRole:
      type: object
      properties:
        title:
          type: string
        reason:
          type: string
        searchQuery:
          type: string
        fitScore:
          type: integer
          minimum: 0
          maximum: 100
      required: [title, reason, searchQuery, fitScore]
    MatchedJob:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/JobListing"
        matchScore:
          type: integer
          minimum: 0
          maximum: 100
        matchedSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        reason:
          type: string
        role:
          type: string
          description: The suggested role whose search returned this job.
      required: [job, matchScore, matchedSkills, missingSkills, reason, role]
    MissingSkill:
      type: object
      properties:
        skill:
          type: string
        reason:
          type: string
        jobCount:
          type: integer
      required: [skill, reason, jobCount]
    MatchMeta:
      type: object
      properties:
        source:
          type: string
          enum: [Himalayas]
        fetchedAt:
          type: string
          format: date-time
        model:
          type: string
        requestedCountry:
          type: ["string", "null"]
        searchedWorldwide:
          type: boolean
      required: [source, fetchedAt, model, requestedCountry, searchedWorldwide]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    JobSearchResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobListing"
        meta:
          $ref: "#/components/schemas/JobSearchMeta"
      required: [jobs, meta]
    JobListing:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        companyName:
          type: string
        description:
          type: string
        employmentType:
          type: ["string", "null"]
        seniority:
          type: ["string", "null"]
        locationRestrictions:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        minSalary:
          type: ["number", "null"]
        maxSalary:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
        salaryPeriod:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
          format: date-time
        applicationUrl:
          type: string
          format: uri
        sourceUrl:
          type: string
          format: uri
        companyLogo:
          type: ["string", "null"]
          format: uri
        remote:
          type: boolean
      required:
        - id
        - title
        - companyName
        - description
        - employmentType
        - seniority
        - locationRestrictions
        - categories
        - minSalary
        - maxSalary
        - currency
        - salaryPeriod
        - publishedAt
        - applicationUrl
        - sourceUrl
        - companyLogo
        - remote
    JobSearchMeta:
      type: object
      properties:
        source:
          type: string
          enum: [Himalayas]
        fetchedAt:
          type: string
          format: date-time
        totalCount:
          type: integer
        returnedCount:
          type: integer
        page:
          type: integer
        nextPage:
          type: ["integer", "null"]
        requestedCountry:
          type: ["string", "null"]
        cacheStatus:
          type: string
          enum: [fresh, stale]
        sourceNote:
          type: string
      required:
        - source
        - fetchedAt
        - totalCount
        - returnedCount
        - page
        - nextPage
        - requestedCountry
        - cacheStatus
        - sourceNote
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

